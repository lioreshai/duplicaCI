# Example duplicaci configuration
# Copy to backup-config.yaml and customize for your environment

ssh:
  host: root@192.168.1.100       # SSH to this host before running commands
  password_env: SSH_PASSWORD     # Read password from this environment variable

docker:
  container: Duplicacy           # Execute inside this Docker container

repositories:
  - id: server_appdata
    storage:
      - gdrive
      - nas-backup
    prune: true
    prune_options: "-keep 0:180 -keep 7:14 -keep 1:1 -a"

  - id: network_config
    storage:
      - gdrive
      - nas-backup
    prune: true
    prune_options: "-keep 0:180 -keep 7:14 -keep 1:1 -a"

notifications:
  forgejo:
    url: https://git.example.com
    repo: myuser/duplicaci
    token_env: FORGEJO_TOKEN     # Read token from this environment variable
    assignee: myuser             # Assign issues to this user
