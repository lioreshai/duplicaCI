name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=${GITHUB_SHA}
          echo "Checking CI status for commit: $COMMIT_SHA"

          # Wait up to 5 minutes for CI to complete
          for i in {1..30}; do
            # Get workflow runs for this commit
            RUNS=$(curl -s \
              "https://git.shai.network/api/v1/repos/${GITHUB_REPOSITORY}/actions/tasks" \
              -H "Authorization: token ${GITHUB_TOKEN}")

            # Check if lint, test, and integration all passed for this SHA
            LINT_STATUS=$(echo "$RUNS" | jq -r ".workflow_runs[] | select(.head_sha == \"$COMMIT_SHA\" and .name == \"lint\") | .status + \":\" + (.conclusion // \"pending\")" | head -1)
            TEST_STATUS=$(echo "$RUNS" | jq -r ".workflow_runs[] | select(.head_sha == \"$COMMIT_SHA\" and .name == \"test\") | .status + \":\" + (.conclusion // \"pending\")" | head -1)
            INTEGRATION_STATUS=$(echo "$RUNS" | jq -r ".workflow_runs[] | select(.head_sha == \"$COMMIT_SHA\" and .name == \"integration\") | .status + \":\" + (.conclusion // \"pending\")" | head -1)

            echo "Lint: $LINT_STATUS, Test: $TEST_STATUS, Integration: $INTEGRATION_STATUS"

            # Check if all passed
            if [[ "$LINT_STATUS" == *":success" ]] && [[ "$TEST_STATUS" == *":success" ]] && [[ "$INTEGRATION_STATUS" == *":success" ]]; then
              echo "All CI checks passed!"
              exit 0
            fi

            # Check for failures
            if [[ "$LINT_STATUS" == *":failure" ]] || [[ "$TEST_STATUS" == *":failure" ]] || [[ "$INTEGRATION_STATUS" == *":failure" ]]; then
              echo "CI failed! Aborting release."
              exit 1
            fi

            echo "Waiting for CI... ($i/30)"
            sleep 10
          done

          echo "Timeout waiting for CI"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          # Linux amd64 (primary target for CI/CD)
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o duplicaci_linux_amd64 .

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o duplicaci_linux_arm64 .

      - name: Create checksums
        run: |
          sha256sum duplicaci_* > checksums.txt
          cat checksums.txt

      - name: Create Release via Forgejo API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Create release
          RELEASE_RESPONSE=$(curl -s -X POST \
            "https://git.shai.network/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${VERSION}\", \"name\": \"${VERSION}\", \"body\": \"Release ${VERSION}\"}")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
          echo "Created release ID: $RELEASE_ID"

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release:"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          # Upload binaries
          for file in duplicaci_linux_amd64 duplicaci_linux_arm64 checksums.txt; do
            echo "Uploading $file..."
            curl -s -X POST \
              "https://git.shai.network/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${file}" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @${file}
          done

          echo "Release ${VERSION} created successfully"
