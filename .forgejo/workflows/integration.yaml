name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DUPLICACY_IMAGE: saspus/duplicacy-web:mini

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Set container name
        id: container
        run: |
          CONTAINER_NAME="duplicacy-test-${GITHUB_SHA::8}"
          echo "name=${CONTAINER_NAME}" >> $GITHUB_OUTPUT
          echo "Container name: ${CONTAINER_NAME}"

      - name: Create test Duplicacy environment
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.name }}
        run: |
          # Create test directories
          mkdir -p /tmp/duplicacy-test/repo
          mkdir -p /tmp/duplicacy-test/storage
          mkdir -p /tmp/duplicacy-test/config

          # Create some test files to backup
          echo "test file 1" > /tmp/duplicacy-test/repo/file1.txt
          echo "test file 2" > /tmp/duplicacy-test/repo/file2.txt
          mkdir -p /tmp/duplicacy-test/repo/subdir
          echo "test file 3" > /tmp/duplicacy-test/repo/subdir/file3.txt

          # Pull Duplicacy image
          docker pull ${DUPLICACY_IMAGE}

          # Start Duplicacy container with unique name
          docker run -d \
            --name ${CONTAINER_NAME} \
            -v /tmp/duplicacy-test/repo:/repo \
            -v /tmp/duplicacy-test/storage:/storage \
            -v /tmp/duplicacy-test/config:/config \
            ${DUPLICACY_IMAGE}

          # Wait for container to start
          sleep 3
          docker ps

          # Initialize a duplicacy repository inside the container
          docker exec ${CONTAINER_NAME} sh -c "cd /repo && duplicacy init test-repo /storage"

          # Verify initialization
          docker exec ${CONTAINER_NAME} sh -c "cd /repo && duplicacy list"

      - name: Run integration tests
        env:
          INTEGRATION_DOCKER_CONTAINER: ${{ steps.container.outputs.name }}
          INTEGRATION_REPO_PATH: /repo
          INTEGRATION_STORAGE: default
        run: |
          go test -tags=integration -v ./internal/executor/ -timeout 5m

      - name: Cleanup
        if: always()
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.name }}
        run: |
          # Stop and remove container with volumes
          docker stop ${CONTAINER_NAME} 2>/dev/null || true
          docker rm -v ${CONTAINER_NAME} 2>/dev/null || true

          # Remove the pulled image
          docker rmi ${DUPLICACY_IMAGE} 2>/dev/null || true

          # Remove all test data
          rm -rf /tmp/duplicacy-test

          # Prune any dangling images/volumes
          docker image prune -f 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

          # Verify nothing remains
          echo "Verifying cleanup..."
          [ ! -d /tmp/duplicacy-test ] && echo "✓ Test directory removed"
          ! docker ps -a --format '{{.Names}}' | grep -q "${CONTAINER_NAME}" && echo "✓ Container removed"
          ! docker images --format '{{.Repository}}:{{.Tag}}' | grep -q "${DUPLICACY_IMAGE}" && echo "✓ Image removed"
