name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Set test environment name
        id: env
        run: |
          ENV_NAME="duplicacy-test-${GITHUB_SHA::8}"
          echo "name=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "Test environment: ${ENV_NAME}"

      - name: Install Duplicacy CLI
        run: |
          # Download latest duplicacy CLI
          curl -L -o /tmp/duplicacy https://github.com/gilbertchen/duplicacy/releases/download/v3.2.3/duplicacy_linux_x64_3.2.3
          chmod +x /tmp/duplicacy
          sudo mv /tmp/duplicacy /usr/local/bin/duplicacy
          duplicacy -version

      - name: Create test environment
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          # Create test directories with unique name
          TEST_DIR="/tmp/${ENV_NAME}"
          mkdir -p ${TEST_DIR}/repo
          mkdir -p ${TEST_DIR}/storage

          # Create test files
          echo "test file 1" > ${TEST_DIR}/repo/file1.txt
          echo "test file 2" > ${TEST_DIR}/repo/file2.txt
          mkdir -p ${TEST_DIR}/repo/subdir
          echo "test file 3" > ${TEST_DIR}/repo/subdir/file3.txt

          # Initialize duplicacy repository
          cd ${TEST_DIR}/repo
          duplicacy init test-repo ${TEST_DIR}/storage

          # Verify
          duplicacy list

          # Save path for later steps
          echo "TEST_DIR=${TEST_DIR}" >> $GITHUB_ENV

      - name: Run integration tests
        env:
          INTEGRATION_REPO_PATH: ${{ env.TEST_DIR }}/repo
          INTEGRATION_STORAGE: default
        run: |
          go test -tags=integration -v ./internal/executor/ -timeout 5m

      - name: Cleanup
        if: always()
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          # Remove test directory
          rm -rf /tmp/${ENV_NAME}

          # Remove duplicacy binary
          sudo rm -f /usr/local/bin/duplicacy

          # Verify cleanup
          echo "Verifying cleanup..."
          [ ! -d /tmp/${ENV_NAME} ] && echo "✓ Test directory removed"
          [ ! -f /usr/local/bin/duplicacy ] && echo "✓ Duplicacy binary removed"
